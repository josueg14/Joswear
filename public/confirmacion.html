<!DOCTYPE html>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">

<script src="js/cart.js"></script>

<script>

  document.getElementById('orderNumber').textContent = '#' + (params.get('order') || '—');
