<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — JOSWEAR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">JOS<span>WEAR</span></a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="tienda.html">Tienda</a>
    </div>
    <div class="nav-right">
      <span class="nav-auth"></span>
      <a href="carrito.html" class="cart-link">Carrito <span class="cart-badge">0</span></a>
    </div>
    <button class="nav-toggle">☰</button>
  </nav>
</header>

<section class="auth-shell">
  <form class="form-card" id="loginForm">
    <h1>Iniciar sesión</h1>
    <p class="lead">Ingresa a tu cuenta JOSWEAR.</p>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" required>
    </div>

    <p class="error-msg" id="errorMsg"></p>
    <button type="submit" class="btn btn-block" id="submitBtn">Entrar</button>

    <p class="form-foot">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    <p class="form-foot" style="color:#6b6b45;">Admin demo: admin@joswear.com / admin123</p>
  </form>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 JOSWEAR. Todos los derechos reservados.</span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = '';
    submitBtn.textContent = 'Ingresando...';
    submitBtn.disabled = true;

    try {
      const data = await apiRequest('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      localStorage.setItem('joswear_token', data.token);
      localStorage.setItem('joswear_user', JSON.stringify(data.user));
      window.location.href = data.user.role === 'admin' ? 'admin.html' : 'index.html';
    } catch (err) {
      errorMsg.textContent = err.message;
      submitBtn.textContent = 'Entrar';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
