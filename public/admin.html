<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — JOSWEAR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">JOS<span>WEAR</span></a>
    <div class="nav-links">
      <a href="index.html">Ver tienda</a>
    </div>
    <div class="nav-right">
      <span class="nav-auth"></span>
    </div>
    <button class="nav-toggle">☰</button>
  </nav>
</header>

<section class="wrap admin-shell">
  <div class="admin-head">
    <h2 class="section-title">Panel de administración</h2>
    <div id="statsBar" style="font-weight:600;"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="productos">Productos</button>
    <button class="tab-btn" data-tab="pedidos">Pedidos</button>
  </div>

  <!-- ===== PRODUCTOS ===== -->
  <div class="tab-panel active" id="tab-productos">
    <div class="admin-grid">
      <form class="form-card" id="productForm" style="max-width:none;">
        <h3 style="font-size:20px; margin-bottom:16px;" id="formTitle">Nuevo producto</h3>
        <input type="hidden" id="productId">

        <div class="field">
          <label>Nombre</label>
          <input type="text" id="p_name" required>
        </div>
        <div class="field">
          <label>Descripción</label>
          <textarea id="p_description"></textarea>
        </div>
        <div class="field">
          <label>Precio (USD)</label>
          <input type="number" step="0.01" id="p_price" required>
        </div>
        <div class="field">
          <label>Categoría</label>
          <select id="p_category" required>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Accesorios">Accesorios</option>
          </select>
        </div>
        <div class="field">
          <label>URL de imagen</label>
          <input type="text" id="p_image" placeholder="https://...">
        </div>
        <div class="field">
          <label>Tallas (separadas por coma)</label>
          <input type="text" id="p_sizes" placeholder="S, M, L, XL">
        </div>
        <div class="field">
          <label>Stock</label>
          <input type="number" id="p_stock" value="50">
        </div>
        <div class="field">
          <label><input type="checkbox" id="p_featured" style="width:auto; display:inline-block;"> Producto destacado</label>
        </div>

        <p class="error-msg" id="productError"></p>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn" id="productSubmitBtn">Guardar producto</button>
          <button type="button" class="btn btn-outline hidden" id="cancelEditBtn">Cancelar</button>
        </div>
      </form>

      <div>
        <table class="data-table">
          <thead>
            <tr><th></th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Destacado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== PEDIDOS ===== -->
  <div class="tab-panel" id="tab-pedidos">
    <table class="data-table">
      <thead>
        <tr><th>#</th><th>Cliente</th><th>Contacto</th><th>Dirección</th><th>Artículos</th><th>Total</th><th>Estado</th><th>Fecha</th></tr>
      </thead>
      <tbody id="ordersTableBody"></tbody>
    </table>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
