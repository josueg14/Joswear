<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda — JOSWEAR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">JOS<span>WEAR</span></a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="tienda.html" class="active">Tienda</a>
      <a href="tienda.html?category=Hombre">Hombre</a>

      <a href="tienda.html?category=Accesorios">Accesorios</a>

    <h2 class="section-title">Tienda</h2>

    <input type="text" id="searchInput" placeholder="Buscar por nombre (ej: hoodie, jogger, gorra)...">

  <div class="filters" id="filterBar">
    <button class="filter-btn" data-cat="">Todo</button>

    <button class="filter-btn" data-cat="Mujer">Mujer</button>

  </div>

  <div class="grid" id="productGrid">
    <p>Cargando productos…</p>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 JOSWEAR. Todos los derechos reservados.</span>
      <a href="index.html">Volver al inicio</a>
